# Workstation: RViz (MotionPlanning panel, arm marker) and the joystick driver, connected to the
# robot's discovery server at ROBOT_IP. Host networking.
#
# Each mode is a Compose profile. docker/.env sets COMPOSE_PROFILES=workstation, so a plain "up"
# starts the workstation; --profile picks another mode instead:
#
#   docker/setup-env.sh workstation                        # once: writes docker/.env
#   ROBOT_IP=<robot address> docker compose -f docker/compose.workstation.yaml up --build
#   docker compose -f docker/compose.workstation.yaml run --rm shell   # ros2 CLI
#   docker compose -f docker/compose.workstation.yaml --profile imu up # IMU validation, no robot
#   docker compose -f docker/compose.workstation.yaml --profile imu-robot up  # the IMU on the robot
#
# ROBOT_IP comes from the environment or docker/.env (see .env.example). The imu profile does
# not use it; imu-robot does.
name: lekiwi-workstation

x-workstation: &workstation
  image: lekiwi:workstation
  build:
    context: ..
    dockerfile: docker/Dockerfile
    target: workstation
    args:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
  network_mode: host
  ipc: host
  init: true

x-workstation-env: &workstation-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  # Not ${ROBOT_IP:?...}: Compose checks that in every service, also the imu profile's, which
  # does not need the robot. entrypoint.sh stops with an error if ROBOT_IP is empty.
  ROS_DISCOVERY_SERVER: ${ROBOT_IP:-}:${DISCOVERY_PORT:-11811}
  ROS_SUPER_CLIENT: "TRUE"            # RViz and the CLI see the whole graph

services:
  workstation:
    <<: *workstation
    profiles: [workstation]
    environment:
      <<: *workstation-env
      DISPLAY: ${DISPLAY:?DISPLAY is not set}
      XAUTHORITY: /tmp/.Xauthority
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY_FILE:-/dev/null}:/tmp/.Xauthority:ro
      - /dev/input:/dev/input         # joysticks, also ones plugged in later
    devices:
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - 'c 13:* rmw'                  # input devices
    # The host groups of the GPU and the joystick. Compose rejects repeated ids: setup-env.sh
    # replaces a repeat with an unused id (65534, 65533), and the defaults are distinct.
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-65534}"
      - "${INPUT_GID:-65533}"
    # WORKSTATION_LAUNCH: the package and launch file. Default: my robot (its model, and the
    # lidar scan and ToF point cloud in RViz); "lekiwi_bringup workstation.launch.py" for the
    # stock LeKiwi.
    command: >-
      ros2 launch ${WORKSTATION_LAUNCH:-manipulator workstation.launch.py}
      rviz:=${WORKSTATION_RVIZ:-true}
      joy:=${WORKSTATION_JOY:-true}
      joy_device:=${JOY_DEVICE:-0}
      joy_deadzone:=${JOY_DEADZONE:-0.166}
    stop_signal: SIGINT

  # Sensor validation: the Pico + LSM6DS3 IMU driver, the Madgwick fusion and RViz, all here on
  # the workstation (pico_lsm6ds3_ros2 validation.launch.py), with the IMU plugged in here. No
  # robot and no discovery server: plain local discovery, limited to this host
  # (ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST), so nothing reaches the network or the robot.
  #
  #   docker compose -f docker/compose.workstation.yaml --profile imu up
  #   docker compose -f docker/compose.workstation.yaml run --rm imu ros2 topic hz /imu/data_raw
  imu:
    <<: *workstation
    profiles: [imu]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      DISPLAY: ${DISPLAY:?DISPLAY is not set}
      XAUTHORITY: /tmp/.Xauthority
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY_FILE:-/dev/null}:/tmp/.Xauthority:ro
      # The IMU by its /dev/input/by-id link, which follows it when it is plugged in again
      # (the driver reconnects); a "devices:" entry would pin one eventN.
      - /dev/input:/dev/input
    devices:
      - /dev/dri:/dev/dri
    device_cgroup_rules:
      - 'c 13:* rmw'                  # input devices, read-write: the driver zeroes axis fuzz if set
    group_add:                        # as above; INPUT_GID also owns the IMU's event node
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-65534}"
      - "${INPUT_GID:-65533}"
    # IMU_DEVICE: the IMU's /dev/input/by-id/...-event-* link (setup-env.sh finds it). Empty:
    # the driver opens the first /dev/input/by-id/usb-2e8a_LSM6DS3*-event-*, and waits for one.
    command: >-
      ros2 launch pico_lsm6ds3_ros2 validation.launch.py
      device:=${IMU_DEVICE:-}
      rviz:=${WORKSTATION_RVIZ:-true}
    stop_signal: SIGINT

  # The IMU check with the IMU on the robot (compose.robot.yaml, profile imu, runs the whole IMU
  # stack there): only RViz here. Through the robot's discovery server, like the workstation
  # service.
  #
  #   docker compose -f docker/compose.workstation.yaml --profile imu-robot up
  imu-robot:
    <<: *workstation
    profiles: [imu-robot]
    environment:
      <<: *workstation-env
      DISPLAY: ${DISPLAY:?DISPLAY is not set}
      XAUTHORITY: /tmp/.Xauthority
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY_FILE:-/dev/null}:/tmp/.Xauthority:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-65534}"
    command: >-
      ros2 launch manipulator imu_test_workstation.launch.py
    stop_signal: SIGINT

  shell:
    <<: *workstation
    profiles: [tools]
    environment: *workstation-env
    stdin_open: true
    tty: true
    command: bash
